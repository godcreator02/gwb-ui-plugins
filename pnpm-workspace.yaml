packages:
  - plugins/*
  # 共享包：不是 cordis 件，是件的依赖（运行时环境、设计令牌）
  - packages/*
  # 文档站：自己的依赖树，不进根 check
  - docs-site

allowBuilds:
  '@parcel/watcher': false
  esbuild: true

# 供应链门豁免：私有源包龄不设限（带本 yaml 的仓整份盖掉用户级配置，须自带）
minimumReleaseAgeExclude:
  - '@godcreator/*'
  - '@godcreator/*'
  - '@godcreator/*'
  - lucide-react@1.43.0
